syntax = "proto3";

package user;

option go_package = "github.com/nbmDaka/nbm-bank-backend/services/user-service/proto/user";


service UserService {

  rpc GetUser(GetUserRequest) returns (GetUserResponse);

}


message GetUserRequest {

  int64 id = 1;

}


message GetUserResponse {

  int64 id = 1;

  string email = 2;

  string first_name = 3;

  string last_name = 4;

}
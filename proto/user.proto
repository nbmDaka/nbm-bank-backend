syntax = "proto3";

package user;

option go_package = "github.com/nbmDaka/nbm-bank-backend/proto/user";


service UserService {

  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetUserResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

}

message GetCurrentUserRequest {

}


message GetUserRequest {

  int64 id = 1;

}

message CreateUserRequest {

  string keycloak_id = 1;

  string email = 2;

  string first_name = 3;

  string last_name = 4;

}

message GetUserResponse {

  User user = 1;

}

message CreateUserResponse {

  User user = 1;

}



message User {

 int64 id = 1;

 string keycloak_id = 2;

 string email = 3;

 string first_name = 4;

 string last_name = 5;
}